function parse(pageTexts){

  {const ip2=types.indexOf("de_nghi_chi");if(ip2>=0){const mm=norm(pageTexts[ip2]).match(/\bh[a-z]\s*[:.;]\s*(\d{3,10})/);if(mm)res.dncNumber=mm[1].replace(/^0+(?=\d)/,"");}}

  const rc={};(n.match(/\b(5|8|10)\s*%/g)||[]).forEach(x=>{const k=parseInt(x);rc[k]=(rc[k]||0)+1;});const rk=Object.keys(rc).sort((x,y)=>rc[y]-rc[x]);res.vatRate=rk.length?Number(rk[0]):null;res.multiRate=rk.length>1;

  const r=res.vatRate;res.fixed=res.fixed||[];
  if(r&&!(Math.abs(res.subtotal+res.vat-res.total)<=2&&(res.multiRate||Math.abs(res.subtotal*r/100-res.vat)<=2))){
    const c=[];if(res.vat){const s1=Math.round(res.vat*100/r);c.push([s1,res.vat,s1+res.vat]);}

    if(best){if(best[0]!==res.subtotal||best[1]!==res.vat||best[2]!==res.total)res.fixed.push("Tự sửa số đọc lệch theo thuế suất "+r+"%");[res.subtotal,res.vat,res.total]=best;}}
  if(res.subtotal&&res.total&&Math.abs(res.subtotal+res.vat-res.total)>2){if(res.total>res.subtotal)res.vat=res.total-res.subtotal;}
  if(res.subtotal&&res.vat&&!res.total)res.total=res.subtotal+res.vat;

  m=n.match(/th[a-z]ng\s*(\d{1,2})\s*\/\s*(20\d{2})/);res.ky=m?`${m[2]}-${String(m[1]).padStart(2,"0")}`:(res.date||"").slice(0,7);
  const items=[];for(const l of lines){const nl=norm(l).trim();const mm=nl.match(/^[|\s]*(\d{1,2})\s*[|.,]?\s+([a-z].{3,}?)\s/);if(!mm)continue;const money=l.match(MONEY);if(!money)continue;
    let amt;const pc=l.search(/\d{1,2}\s*%/);if(pc>0){const before=l.slice(0,pc).match(MONEY);amt=before?toNum(before[before.length-1]):toNum(money[money.length-1]);}else amt=toNum(money[money.length-1]);
    const desc=l.replace(/^[\W\s]*\d{1,2}\s*[|.,]?\s*/,"").replace(MONEY,"").replace(/\s(c[aá]i|l[ií]t|cu[oộ]n|kg|can|th[uù]ng|b[iị]ch|x[aấ]p|th[aá]ng|kwh|m3|chai|b[oộ]|h[oộ]p)\b.*$/i,"").replace(/[|_~\]\[}{]/g," ").replace(/\s+/g," ").trim();

function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v));}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Không tải được "+src));document.head.appendChild(s);});}

const toB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(f);});
async function storeFile(file,folder){
  if(DEMO)return URL.createObjectURL(file);
  if(file.size>3.2*1024*1024)throw new Error(`${file.name} nặng ${(file.size/1048576).toFixed(1)} MB, vượt giới hạn 3,2 MB mỗi file của Vercel. Scan lại ở độ phân giải thấp hơn (150–200 dpi) hoặc tách file.`);
  const safe=file.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^\w.\-]+/g,"_");
  const r=await fetch((CFG.apiBase||"/api")+"/upload",{method:"POST",headers:{"content-type":"application/json","x-app-token":CFG.appToken||""},body:JSON.stringify({path:`${S.rap}/${folder}/${safe}`,mime:file.type,data:await toB64(file)})});
  const j=await r.json().catch(()=>({error:"Lỗi máy chủ "+r.status}));if(!r.ok)throw new Error(j.error||"Lỗi "+r.status);return j.url;}

/* ---------- Quét PDF: pdf.js + OCR trên trình duyệt ---------- */
async function renderPdf(src,scale){
  if(!window.pdfjsLib)throw new Error("Không tải được thư viện đọc PDF.");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const data=src instanceof Blob?{data:await src.arrayBuffer()}:{url:src};
  const pdf=await pdfjsLib.getDocument(data).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const v=pg.getViewport({scale:scale||2.6});const c=document.createElement("canvas");c.width=v.width;c.height=v.height;
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:v}).promise;out.push(c);}
  return out;}
const thumb=c=>{const t=document.createElement("canvas");const w=700;t.width=w;t.height=Math.round(c.height*w/c.width);t.getContext("2d").drawImage(c,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.7);};
async function ocrPages(canvases,step){
  if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const worker=await Tesseract.createWorker("vie+eng");const texts=[];
  try{for(let i=0;i<canvases.length;i++){step(`Đang quét chữ trang ${i+1}/${canvases.length}…`);const {data}=await worker.recognize(canvases[i]);texts.push(data.text||"");}}
  finally{await worker.terminate();}
  return texts;}

const invIfc=d=>d.ifc||tpls()[d.seller?.mst]?.ifc||ifcOfCat(d.cat);
function checks(d,selfId){
  const c=[],add=(lv,t,f)=>c.push({lv,t,f});const items=d.items||[];const sum=items.reduce((s,x)=>s+num(x.amount),0);
  if(!items.length)add("bad","Chưa có dòng hàng hóa/dịch vụ","items");else if(Math.abs(sum-d.subtotal)>1)add("bad",`Cộng các dòng ${fmt(sum)} ≠ Tiền trước thuế ${fmt(d.subtotal)}`,"subtotal");

  if(!d.seller?.mst)add("bad","Chưa có MST người bán","mst");else if(!S.byMst.has(d.seller.mst))add("warn","MST không có trong danh mục NCC công ty","mst");
  if(!d.number)add("bad","Chưa có số hóa đơn","number");
  if(!d.date)add("bad","Chưa có ngày hóa đơn","date");
  if(!d.ky)add("bad","Chưa có kỳ chi phí","ky");
  if(!d.cat)add("bad","Chưa chọn diễn giải chi phí","cat");else if(!invIfc(d))add("bad","Diễn giải chưa gắn IFC code","cat");
  if(items.some(x=>!x.hm))add("warn","Có dòng chưa gắn hạng mục kinh phí","hm");
  if(!d.noDnc&&!d.payeeKey)add("bad","Chưa chọn người thụ hưởng","payee");

  if(dup)add("bad",`Trùng hóa đơn đã lưu ngày ${dmy(dup.createdAt)}`,"number");
  if(d.dncNumber&&d.number&&d.dncNumber!==d.number)add("warn",`Số HĐ đọc trên hóa đơn (${d.number}) khác số ghi trên ĐNC kèm theo (${d.dncNumber}). Kiểm tra bản gốc.`,"number");
  if(d.mstFixed)add("warn",`MST đọc được ${d.mstFixed} không có trong danh mục, đã lấy MST gần nhất ${d.seller.mst}.`,"mst");
  (d.fixed||[]).forEach(x=>add("warn",x,""));
  if(d.payeeKey==="__new")add("warn","Tài khoản thụ hưởng mới. Đối chiếu trước khi xác nhận.","payee");
  if(d.invoiceCount>1)add("warn",`File có ${d.invoiceCount} hóa đơn. Tách file và tải lại phần còn lại.`,"");
  if(d.ky&&d.date&&d.ky!==ymOf(d.date))add("inf",`Kỳ chi phí ${ymLbl(d.ky)} khác tháng hóa đơn ${ymLbl(ymOf(d.date))}: Kinh phí tính vào ${ymLbl(d.ky)}, ĐNC nằm ở tháng ${ymLbl(ymOf(d.date))}.`,"");

  (d.flags||[]).forEach(x=>add("warn",x,""));
  return c;}

/* ---------- Tải hóa đơn ---------- */
async function fileHash(f){try{const d=await crypto.subtle.digest("SHA-256",await f.arrayBuffer());return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return"";}}
async function logIt(file,result,msg){await Store.put("log",uid(),{at:nowIso(),file,result,msg});}
async function skip(q,result,msg){q.err=msg;q.state=result;q.skipped=true;render();await logIt(q.name,result,msg);}
async function addFiles(files){
  for(const f of files){if(!/pdf|image\//.test(f.type)){S.queue.push({id:uid(),name:f.name,state:"Không đọc",err:"Chỉ nhận PDF hoặc ảnh.",skipped:true});continue;}S.queue.push({id:uid(),file:f,name:f.name,state:"Đang kiểm tra file…"});}
  render();for(const q of [...S.queue]){if(q.started||q.skipped)continue;q.started=true;await processItem(q);}}
async function processItem(q){
  const step=t=>{q.state=t;render();};
  try{
    const hash=await fileHash(q.file);
    const same=hash&&(S.inv.find(i=>i.fileHash===hash)||S.docs.find(i=>i.fileHash===hash));
    if(same)return skip(q,"Trùng",`File này đã tải lên trước đây (${same.number?"HĐ "+same.number:same.type} ngày ${dmy(same.date)}). Không đọc lại.`);
    if(hash&&S.queue.some(x=>x!==q&&x.hash===hash))return skip(q,"Trùng","File bị chọn hai lần trong lượt này.");
    q.hash=hash;step("Đang chuyển trang PDF thành ảnh…");
    let canvases;try{canvases=q.file.type.startsWith("image/")?[await imgCanvas(q.file)]:await renderPdf(q.file);}catch(e){return skip(q,"Lỗi","File lỗi, không mở được: "+(e.message||e));}
    let texts;try{texts=await ocrPages(canvases,step);}catch(e){return skip(q,"Không đọc",DEMO?"Bản xem trước trong Claude không tải được bộ quét chữ (OCR). Trên Vercel file này được quét tự động.":"Không chạy được bộ quét chữ: "+(e.message||e));}
    const r=OCRP.parse(texts);
    if(!r.ok){const t=r.pages.map(p=>p.type);if(t.includes("thong_bao")){step("Đang lưu chứng từ khác…");const url=await storeFile(q.file,"chung-tu-khac");
        await Store.put("docs",uid(),{type:"Thông báo thanh toán",month:curYM(),date:today(),seller:{name:"",mst:""},number:"",total:0,note:"Lưu từ file "+q.name,file:{name:q.name,url,pages:canvases.map(thumb)},fileHash:hash});
        return skip(q,"Chứng từ khác","Không phải hóa đơn. Đã lưu vào Chứng từ khác.");}
      return skip(q,"Không đọc","Không tìm thấy hóa đơn GTGT trong file. Không lưu.");}
    const d=buildDraft(r,q);
    const miss=[!d.seller.mst&&"MST",!d.number&&"số hóa đơn",!d.total&&"tổng tiền"].filter(Boolean);
    if(miss.length)return skip(q,"Lỗi",`Hóa đơn mờ hoặc lỗi, không đọc được ${miss.join(", ")}. Scan lại rõ hơn rồi tải lên.`);
    const dup=S.inv.find(i=>i.seller?.mst===d.seller.mst&&String(i.number)===String(d.number)&&String(i.serial||"")===String(d.serial||""));
    if(dup)return skip(q,"Trùng",`Trùng HĐ ${d.serial} ${d.number} (${d.seller.name}) đã ${dup.status==="confirmed"?"lưu":"chờ xác nhận"}. Không tạo ĐNC.`);
    step("Đang lưu file gốc…");
    d.file={name:q.name,url:await storeFile(q.file,(d.date||"chua-ro").slice(0,7)+"/hoa-don"),pages:canvases.map(thumb)};d.fileHash=hash;
    await Store.put("inv",uid(),d);S.queue=S.queue.filter(x=>x!==q);render();
  }catch(e){q.err=e.message||String(e);q.state="Lỗi";q.skipped=true;render();}
}
function imgCanvas(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);ok(c);};im.onerror=no;im.src=URL.createObjectURL(f);});}
function ruleFor(tpl,desc){const n=nrm(desc);const rs=(tpl?.rules||[]);return rs.find(r=>r[0]&&n.includes(nrm(r[0])))||rs.find(r=>!r[0])||null;}
function buildDraft(r,q){
  let mst=r.mst,mstFixed=null;if(mst&&!S.byMst.has(mst)){const near=nearestMst(mst);if(near){mstFixed=mst;mst=near;}}
  const tpl=tpls()[mst]||null;
  if(tpl?.anchors){const a=OCRP.readAnchors(r.text,tpl.anchors);["number","date","subtotal","vat","total"].forEach(k=>{if(a[k]&&!r[k])r[k]=a[k];});}
  let serial=r.serial;if(tpl?.lastSerial&&(!serial||serial!==tpl.lastSerial&&serial.length===tpl.lastSerial.length&&[...serial].filter((ch,i)=>ch!==tpl.lastSerial[i]).length<=1))serial=tpl.lastSerial;
  const v=(S.byMst.get(mst)||[])[0];const used=S.inv.find(i=>i.status==="confirmed"&&i.seller?.mst===mst&&i.vendorNo);
  let items=(r.items&&r.items.length?r.items:[{desc:"",amount:r.subtotal}]).map(it=>{const ru=ruleFor(tpl,it.desc);return{desc:it.desc,amount:it.amount,vatRate:r.vatRate||tpl?.vatRate||null,hm:ru?ru[2]:""};});
  const first=ruleFor(tpl,items.map(x=>x.desc).join(" "));const cat=first?first[1]:"";
  const gopTxt=tpl?.gop?.[cat]||null;
  const bk=banks().find(b=>b.mst&&mstN(b.mst)===mst);
  return{status:"draft",createdAt:nowIso(),source:"Quét từ PDF",pages:r.pages,invoiceCount:r.invoiceCount||1,text:r.text,
    seller:{name:v?v[1]:(tpl?.name||""),mst},mstFixed,vendorNo:used?used.vendorNo:(v?v[0]:""),serial,number:r.number||"",numberRaw:r.numberRaw||r.number||"",dncNumber:r.dncNumber||"",
    date:r.date||"",month:ymOf(r.date),ky:r.ky||ymOf(r.date),items,subtotal:r.subtotal||0,vat:r.vat||0,total:r.total||0,fixed:r.fixed||[],
    cat,gop:gopTxt,payeeKey:tpl?.payeeKey||(bk?bk.key:S.settings?.thuHuongMacDinh||""),noDnc:!!tpl?.noDnc,note:"",userNote:"",learned:!!tpl};
}
function learnTemplate(d){
  const st=clone(S.settings);st.templates=st.templates||{};const t=st.templates[d.seller.mst]||{name:d.seller.name,rules:[],learned:0};
  t.name=t.name||d.seller.name;t.payeeKey=d.noDnc?t.payeeKey:d.payeeKey;t.noDnc=!!d.noDnc;t.lastSerial=d.serial||t.lastSerial;

  d.items.forEach(it=>{const kw=nrm(it.desc).split(" ").slice(0,2).join(" ");if(!kw)return;const ex=t.rules.find(r=>r[0]&&nrm(r[0])===kw);if(ex){ex[1]=d.cat;ex[2]=it.hm;}else t.rules.push([kw,d.cat,it.hm]);});
  if(!t.rules.some(r=>!r[0]))t.rules.push(["",d.cat,d.items[0]?.hm||""]);
  t.gop=t.gop||{};if(d.gop)t.gop[d.cat]=d.gopTpl||d.gop;else delete t.gop[d.cat];
  t.learned=(t.learned||0)+1;st.templates[d.seller.mst]=t;return st;}

  const base=i.gop?[{desc:String(i.gop).replace("{MM}",mm),pre:i.subtotal}]:(i.items||[]).map(it=>({desc:it.desc,pre:it.amount}));

  const total=invs.reduce((s,i)=>s+i.subtotal+i.vat,0);const b=bankBy(dn.payeeKey)||{};

async function printDncs(list){
  if(!list.length)return;const pd=today();
  $("#printArea").innerHTML=list.map(dn=>{const x=dncData(Object.assign({},dn,{ngayDeNghi:dn.ngayDeNghi||pd}));return dncHtml(x);}).join("");
  if(DEMO){toast("Bản xem trước trong Claude không mở được hộp thoại in. Trên Vercel nút này mở hộp thoại in / lưu PDF, sau đó ĐNC chuyển sang 'Đã in – chờ ký'.","inf");return;}
  window.print();
  for(const dn of list){if(dn.status!=="open")continue;await Store.put("dnc",dn.id,Object.assign({},dn,{status:"printed",printedAt:pd,ngayDeNghi:dn.ngayDeNghi||pd}));}}
async function uploadSigned(dnId,file){const dn=S.dnc.find(x=>x.id===dnId);if(!dn)return;
  try{let page="";if(file.type==="application/pdf"){const c=await renderPdf(file,1.6);page=c[0]?thumb(c[0]):"";}else page=URL.createObjectURL(file);
    const url=await storeFile(file,dn.month+"/dnc-da-ky");await Store.put("dnc",dn.id,Object.assign({},dn,{status:"signed",signedUrl:url,signedPage:page,signedAt:nowIso(),signedNote:"Bản scan ĐNC đã ký"}));toast("Đã lưu ĐNC đã ký.");}
  catch(e){toast("Không lưu được file: "+(e.message||e),"bad");}}

function kpRows(y){return(KP[y]?.rows)||KPROWS;}
function kpVal(y,m,stt){const k=KP[y];const ym=`${y}-${String(m).padStart(2,"0")}`;
  if(k&&m<=k.fileMonths){const r=k.rows.find(x=>x.stt===stt);return{v:r?r.m[m-1]:0,src:"File"};}
  let v=0;S.inv.forEach(i=>{if(i.status!=="confirmed"||i.ky!==ym)return;(i.items||[]).forEach(it=>{if(it.hm===stt||String(it.hm||"").startsWith(stt+"."))v+=it.amount;});});
  return{v,src:"HĐ"};}
function kpTable(y,m){
  const rows=kpRows(y);const isSec=s=>!s.includes(".");
  const val=(yy,mm,r)=>{if(mm<1){yy=String(+yy-1);mm+=12;}const rr=matchRow(yy,r);if(!rr)return null;
    if(isSec(rr.stt)){const kids=kpRows(yy).filter(x=>x.stt.split(".").length===2&&x.stt.startsWith(rr.stt+"."));return kids.reduce((s,x)=>s+kpVal(yy,mm,x.stt).v,0);}
    return kpVal(yy,mm,rr.stt).v;};
  const out=rows.map(r=>{const c=val(y,m,r),lm=val(y,m-1,r),ly=val(String(+y-1),m,r);const src=(KP[y]&&m<=KP[y].fileMonths)?"File":"Hóa đơn";
    return{r,cur:c||0,lm,ly,src,lvl:r.stt.split(".").length};});
  const secs=out.filter(o=>o.lvl===1);const T={cur:secs.reduce((s,o)=>s+o.cur,0),lm:secs.reduce((s,o)=>s+(o.lm||0),0),ly:secs.reduce((s,o)=>s+(o.ly||0),0)};
  return{out,T};}
const _mcache=new Map();
function matchRow(yy,r){const key=yy+"|"+r.stt+"|"+r.name;if(_mcache.has(key))return _mcache.get(key);const rows=kpRows(yy);let res=null;
  if(rows===kpRows($("#year").value)&&rows.includes(r))res=r;else{const n=nrm(r.name);const same=rows.filter(x=>nrm(x.name)===n);res=same.find(x=>x.stt===r.stt)||same[0]||rows.find(x=>{const a=nrm(x.name);return a.length>5&&n.length>5&&(a.startsWith(n)||n.startsWith(a))})||null;}
  _mcache.set(key,res);return res;}
function vatFlags(y,m){const ym=`${y}-${String(m).padStart(2,"0")}`;const k=KP[y];const out=new Map();if(!k||m>k.fileMonths)return out;
  const inc=new Map(),pre=new Map();S.inv.forEach(i=>{if(i.status!=="confirmed"||i.ky!==ym)return;const share=i.subtotal?(i.subtotal+i.vat)/i.subtotal:1;
    (i.items||[]).forEach(it=>{if(!it.hm)return;pre.set(it.hm,(pre.get(it.hm)||0)+it.amount);inc.set(it.hm,(inc.get(it.hm)||0)+it.amount*share);});});
  for(const [hm,p] of pre){const r=k.rows.find(x=>x.stt===hm);if(!r)continue;const fv=r.m[m-1];const iv=Math.round(inc.get(hm));
    if(Math.abs(fv-iv)<=2&&Math.abs(fv-p)>2)out.set(hm,{type:"vat",pre:p,file:fv});else if(Math.abs(fv-p)>2&&Math.abs(fv-iv)>2)out.set(hm,{type:"diff",pre:p,file:fv});}
  return out;}
function kpNote(y,m,stt){const k=KP[y];const parts=[];const n=k?.notes?.[stt]?.[String(m)];if(n)parts.push(n);
  if(!(k&&m<=k.fileMonths)){const ym=`${y}-${String(m).padStart(2,"0")}`;S.inv.filter(i=>i.status==="confirmed"&&i.ky===ym).forEach(i=>(i.items||[]).forEach(it=>{if(it.hm===stt)parts.push(`${it.desc}: ${fmt(it.amount)}${i.userNote?" ("+i.userNote+")":""}`);}));}
  return parts.join("\n");}
function kpNoteFor(y,m,r){if(m<1){y=String(+y-1);m+=12;}const rr=matchRow(y,r);return rr?kpNote(y,m,rr.stt):"";}
function kpInfo(y,r){const rr=matchRow(y,r);return rr?(KP[y]?.info||{})[rr.stt]||"":"";}
function kpHasNote(y,m,r){return!!(kpInfo(y,r)||kpNoteFor(y,m,r)||kpNoteFor(y,m-1,r)||kpNoteFor(String(+y-1),m,r));}
function kpNotes3(y,m,r){const ly=String(+y-1);const info=kpInfo(y,r)||kpInfo(ly,r);const n=t=>t?`<div class="note">${esc(t)}</div>`:"";
  return[(info?`<div class="nsec"><div class="nh">Hạng mục</div><div class="note">${esc(info)}</div></div>`:"")+n(kpNoteFor(y,m,r)),n(kpNoteFor(y,m-1,r)),n(kpNoteFor(ly,m,r))];}

     const ns=S.showNotes?kpNotes3(y,m,o.r):null;const has=!S.showNotes&&kpHasNote(y,m,o.r);return`<tr class="${o.lvl===1?"sec":o.lvl===2?"l2 click":"click"} ${sel===o.r.stt?"sel":""}" ${o.lvl>1?`data-a="bsel" data-k="${esc(o.r.stt)}"`:""}>

/* ---------- Checklist ĐNC ---------- */
const ckKey=i=>(i.seller?.mst||i.seller?.name||"?")+"|"+(i.cat||"");
function checklist(m){const lm=ymAdd(m,-1),ly=ymAdd(m,-12);const map=new Map();
  const add=(i,slot)=>{const k=ckKey(i);if(!map.has(k))map.set(k,{k,ncc:i.seller?.name||"",mst:i.seller?.mst||"",cat:i.cat,cur:0,lm:0,ly:0,invCur:[],drafts:0});const r=map.get(k);if(slot==="cur"){r.cur+=i.subtotal;r.invCur.push(i);}else r[slot]+=i.subtotal;};
  S.inv.filter(i=>i.status==="confirmed"&&!i.noDnc).forEach(i=>{if(i.ky===m)add(i,"cur");else if(i.ky===lm)add(i,"lm");else if(i.ky===ly)add(i,"ly");});
  S.inv.filter(i=>i.status==="draft"&&i.ky===m).forEach(i=>{const k=ckKey(i);if(map.has(k))map.get(k).drafts++;});
  const rows=[...map.values()].map(r=>{let st;if(!r.invCur.length)st=r.drafts?["Chờ xác nhận HĐ","warn",1]:["Chưa làm","bad",0];
    else{const ds=r.invCur.map(i=>S.dnc.find(x=>x.id===i.dncId)?.status||"open");st=ds.includes("open")?[ST.open[0],"warn",2]:ds.includes("printed")?[ST.printed[0],"inf",3]:[ST.signed[0],"ok",4];}
    return Object.assign(r,{st,isNew:r.invCur.length&&!r.lm&&!r.ly});});
  rows.sort((a,b)=>a.st[2]-b.st[2]||b.lm-a.lm||b.cur-a.cur);return{rows,lm,ly};}

  const m=curYM();const ck=checklist(m);const cnt=s=>ck.rows.filter(r=>r.st[0]===s).length;
  const list=S.dnc.filter(x=>x.month===m).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  if(!list.some(x=>x.id===S.selDnc))S.selDnc=list[0]?.id||null;const open=list.filter(x=>x.status==="open");
  const ckHtml=`<div class="panel"><span class="ttl">Checklist ĐNC kỳ ${ymLbl(m)} · so với kỳ trước (${ymLbl(ck.lm)}) và cùng kỳ năm trước (${ymLbl(ck.ly)})</span>
   <div class="chips">${[["Chưa làm","bad"],["Chờ xác nhận HĐ","warn"],[ST.open[0],"warn"],[ST.printed[0],"inf"],[ST.signed[0],"ok"]].map(([s,c])=>`<div class="chip"><span class="k">${s}</span><b style="color:var(--${c==="inf"?"accent":c})">${cnt(s)}</b></div>`).join("")}</div>
   ${ck.rows.length?`<div class="scroll"><table class="t"><thead><tr><th>NCC</th><th>Diễn giải chi phí</th><th class="n">${ymLbl(ck.lm)}</th><th class="n">${ymLbl(ck.ly)}</th><th class="n">${ymLbl(m)}</th><th>Trạng thái kỳ này</th></tr></thead><tbody>
   ${ck.rows.map(r=>`<tr class="${r.st[2]===0?"miss":""}"><td>${esc(r.ncc)}<div class="k">${esc(r.mst)}</div></td><td>${esc(r.cat)}${r.isNew?` <span class="pill neu">Mới phát sinh</span>`:""}</td>
     <td class="n">${r.lm?fmt(r.lm):"—"}</td><td class="n">${r.ly?fmt(r.ly):"—"}</td><td class="n"><b>${r.cur?fmt(r.cur):"—"}</b></td><td><span class="pill ${r.st[1]}">${r.st[0]}</span></td></tr>`).join("")}
   </tbody></table></div>`
   :`<div class="empty">Kỳ này và các kỳ so sánh chưa có hóa đơn.</div>`}</div>`;
  if(!list.length)return ckHtml+`<div class="panel empty">Tháng ${ymLbl(m)} chưa có ĐNC. ĐNC nằm theo tháng của ngày hóa đơn.</div>`;
  const items=list.map(dn=>{const x=dncData(dn);return`<div class="ditem" data-a="sel" data-id="${dn.id}" aria-current="${dn.id===S.selDnc}" tabindex="0">
   <div class="row"><b class="grow">${esc(dn.ifc)} · ${esc(ifcName(dn.ifc))}</b><span class="pill ${ST[dn.status][1]}">${ST[dn.status][0]}</span></div>
   <div class="k">${esc(x.bank.ten)} · ${x.nInv} HĐ · ngày đề nghị ${esc(dmy(dn.ngayDeNghi||dn.createdAt))}${dn.seq>1?` · lần ${dn.seq}`:""}</div><div class="num"><b>${fmt(x.total)}</b> đ</div></div>`;}).join("");
  const sel=list.find(x=>x.id===S.selDnc);const sd=dncData(sel);
  const code=`ĐNC ${S.rap}-${sel.month}-${sel.ifc}-${String(sel.seq).padStart(2,"0")}`;
  const body=sel.status==="signed"&&sel.signedPage?`<div class="page"><img src="${esc(sel.signedPage)}" alt="ĐNC đã ký"></div>`:`<div class="paperbox">${dncHtml(sd)}</div>`;
  const actions=sel.status==="signed"?`${sel.signedUrl?`<a href="${esc(sel.signedUrl)}" target="_blank" rel="noopener">📎 Mở file gốc</a>`:""}<button class="b g" data-a="toggleRender" data-id="${sel.id}">${S.showRender===sel.id?"Xem bản đã ký":"Xem bản app dựng lại"}</button>`
    :`<button class="b p" data-a="print" data-id="${sel.id}">🖨 Xuất PDF</button>${sel.status==="printed"?`<button class="b" data-a="signUp" data-id="${sel.id}">📎 Tải ĐNC đã ký</button>`:""}`;
  return ckHtml+`<div class="split"><div class="panel"><div class="row"><span class="ttl grow">${list.length} ĐNC tháng ${ymLbl(m)}</span><button class="b" data-a="printall" ${open.length?"":"disabled"}>🖨 Xuất PDF ${open.length} ĐNC chưa in</button></div><div class="dlist">${items}</div></div>
   <div class="panel"><div class="row"><span class="ttl grow">${esc(code)}</span>${actions}</div>
   <div class="k">${sel.status==="open"?"Xuất PDF để in. Sau khi in, ĐNC chuyển sang 'Đã in – chờ ký'; hóa đơn mới cùng nhóm sẽ sang ĐNC lần sau.":sel.status==="printed"?"Có chữ ký rồi thì tải bản scan lên để lưu trữ.":esc(sel.signedNote||"ĐNC đã ký, lưu trữ xong.")}</div>
   ${sel.status==="signed"&&S.showRender!==sel.id?body:`<div class="paperbox">${dncHtml(sd)}</div>`}</div></div><input type="file" id="signFile" accept="application/pdf,image/*" hidden>`;}

/* ---------- Lưu trữ chứng từ ---------- */
function arcItems(m){const q=S.arch.trim().toLowerCase();
  const inv=S.inv.filter(i=>i.status==="confirmed"&&i.month===m).map(i=>({kind:"inv",o:i,date:i.date}));
  const docs=S.docs.filter(d=>d.month===m).map(d=>({kind:"doc",o:d,date:d.date}));
  const scans=S.scans.filter(d=>d.mod==="dnc"&&d.month===m).map(d=>({kind:"doc",o:Object.assign({},d,{seller:{name:d.type},number:d.file?.name||"",total:0,pages:[]}),date:d.date}));
  return[...inv,...docs,...scans].filter(x=>!q||[x.o.seller?.name,x.o.seller?.mst,x.o.number,x.o.cat,x.o.note,x.o.type].join(" ").toLowerCase().includes(q)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));}
function vArchive(){
  const m=curYM();const list=arcItems(m);if(!list.some(x=>x.o.id===S.selArc)){S.selArc=list[0]?.o.id||null;S.arcPage=0;S.arcView="pages";}
  const tot=list.filter(x=>x.kind==="inv").reduce((a,x)=>[a[0]+x.o.subtotal,a[1]+x.o.total],[0,0]);
  const left=`<div class="panel"><div class="row"><span class="ttl grow">Tháng ${ymLbl(m)} · ${list.length} chứng từ</span></div>
   <input id="arch" placeholder="🔍 Tìm NCC, MST, số HĐ, diễn giải…" value="${esc(S.arch)}">
   <div class="k">Trước thuế ${fmt(tot[0])} đ · Tổng thanh toán ${fmt(tot[1])} đ</div>
   <div class="dlist">${list.length?list.map(x=>{const o=x.o;const dn=x.kind==="inv"?S.dnc.find(d=>d.id===o.dncId):null;
     return`<div class="ditem" data-a="arcSel" data-id="${o.id}" aria-current="${o.id===S.selArc}" tabindex="0"><div class="row"><b class="grow">${esc(o.seller?.name||o.type)}</b>${x.kind==="doc"?`<span class="pill neu">${esc(o.type)}</span>`:dn?`<span class="pill ${ST[dn.status][1]}">${ST[dn.status][0]}</span>`:`<span class="pill neu">Không ra ĐNC</span>`}</div>
     <div class="k">${x.kind==="inv"?`HĐ ${esc(o.serial)} ${esc(o.numberRaw||o.number)} · ${esc(dmy(o.date))} · ${esc(o.cat)}`:`${esc(o.number)} · ${esc(dmy(o.date))}`}</div>
     <div class="row"><span class="num grow"><b>${fmt(o.total)}</b> đ</span>${o.file?.pages?.length?`<span class="k">${o.file.pages.length} trang</span>`:`<span class="k">${esc(o.source||"")}</span>`}</div></div>`}).join(""):`<div class="empty">Chưa có chứng từ trong tháng này.</div>`}</div></div>`;
  const cur=list.find(x=>x.o.id===S.selArc);
  return `<div class="split">${left}<div class="panel">${cur?arcDetail(cur):`<div class="empty">Chọn một chứng từ bên trái để xem.</div>`}</div></div><input type="file" id="signFile" accept="application/pdf,image/*" hidden>`;}
function arcDetail(x){const o=x.o;const pages=o.file?.pages||[];S._arcPages=pages;S._arcFile=o.file;const types=o.pages||[];const dn=x.kind==="inv"?S.dnc.find(d=>d.id===o.dncId):null;
  const view=S.arcView;const pi=Math.min(S.arcPage,Math.max(pages.length-1,0));
  const tabs=`<nav class="tabs small"><button data-a="arcView" data-k="pages" aria-selected="${view==="pages"}">Bộ chứng từ (${pages.length} trang)</button>${x.kind==="inv"&&dn?`<button data-a="arcView" data-k="dnc" aria-selected="${view==="dnc"}">ĐNC đi kèm</button>`:""}<button data-a="arcView" data-k="info" aria-selected="${view==="info"}">Thông tin & kiểm tra</button></nav>`;
  let body="";
  if(view==="pages")body=pages.length?`<div class="viewer"><div class="strip">${pages.map((p,i)=>`<button data-a="arcPage" data-k="${i}" aria-current="${i===pi}" title="${esc(PAGE[types[i]?.type]||"")}"><img src="${esc(p)}" alt="Trang ${i+1}"><span>${i+1}. ${esc((PAGE[types[i]?.type]||"").split(" ")[0])}</span></button>`).join("")}</div>
     <div><div class="row" style="margin-bottom:6px"><span class="ttl grow">Trang ${pi+1}/${pages.length} · ${esc(PAGE[types[pi]?.type]||"")}</span><button class="b sm" data-a="pdfArc">⬇ Xuất PDF</button><button class="b sm" data-a="printArc">🖨 In bản scan</button>${o.file?.url?`<a href="${esc(o.file.url)}" target="_blank" rel="noopener">Mở file PDF gốc</a>`:""}</div><div class="page"><img src="${esc(pages[pi])}" alt="Trang ${pi+1}"></div></div></div>`
    :`<div class="empty">${esc(o.source||"Chưa có file")} — hóa đơn này nhập từ file ĐNC.xlsx nên chưa có bản scan.</div>`;
  else if(view==="dnc"&&dn){const sd=dncData(dn);body=`<div class="row"><span class="ttl grow">ĐNC ${esc(dn.ifc)} · ${ST[dn.status][0]} · ${dncInvs(dn).length} HĐ</span>${dn.status==="open"?`<button class="b p" data-a="print" data-id="${dn.id}">🖨 Xuất PDF</button>`:dn.status==="printed"?`<button class="b" data-a="signUp" data-id="${dn.id}">📎 Tải ĐNC đã ký</button>`:""}<button class="b g" data-a="goDnc" data-id="${dn.id}">Mở trong Danh sách ĐNC</button></div>
     ${dn.status==="signed"&&dn.signedPage?`<div class="k">Bản đã ký (scan):</div><div class="page"><img src="${esc(dn.signedPage)}" alt="ĐNC đã ký"></div><div class="k">Bản app dựng lại từ hóa đơn:</div>`:""}<div class="paperbox">${dncHtml(sd)}</div>`;}
  else{const cs=x.kind==="inv"?checks(o,o.id).filter(c=>c.lv!=="inf"||true):[];
    body=`<div class="kv">${x.kind==="inv"?`<div>NCC</div><div>${esc(o.seller?.name)} · MST ${esc(o.seller?.mst)}${o.vendorNo?" · "+esc(o.vendorNo):""}</div><div>Hóa đơn</div><div>${esc(o.serial)} · số ${esc(o.numberRaw||o.number)} · ngày ${esc(dmy(o.date))}</div>
      <div>Kỳ chi phí</div><div>${ymLbl(o.ky)}</div><div>Diễn giải ĐNC</div><div>${esc(o.cat)} · IFC ${esc(o.ifc||invIfc(o))}${o.gop?` · ghi gộp "${esc(String(o.gop).replace("{MM}",(o.ky||"").slice(5)))}"`:""}</div>
      <div>Tiền</div><div>Trước thuế ${fmt(o.subtotal)} · VAT ${fmt(o.vat)} · <b>Tổng ${fmt(o.total)}</b></div><div>Nguồn</div><div>${esc(o.source||"")}</div>`
      :`<div>Đơn vị</div><div>${esc(o.seller?.name)}</div><div>Số</div><div>${esc(o.number)}</div><div>Ngày</div><div>${esc(dmy(o.date))}</div><div>Số tiền</div><div>${fmt(o.total)}</div><div>Ghi chú</div><div>${esc(o.note)}</div>`}</div>
     ${x.kind==="inv"?`<div class="scroll"><table class="t"><thead><tr><th>Dòng hàng / dịch vụ</th><th class="n">Trước thuế</th><th>VAT</th><th>Hạng mục kinh phí</th></tr></thead><tbody>${(o.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td class="n">${fmt(it.amount)}</td><td>${it.vatRate!=null?it.vatRate+"%":"—"}</td><td>${esc(it.hm)} ${esc(hmName(it.hm))}</td></tr>`).join("")}</tbody></table></div>
      <div class="checks">${cs.map(c=>`<div><span class="pill ${{bad:"bad",warn:"warn",inf:"inf"}[c.lv]}">${c.lv==="bad"?"Lỗi":c.lv==="warn"?"Cảnh báo":"Thông tin"}</span><span>${esc(c.t)}</span></div>`).join("")}</div>
      ${!dn||dn.status==="open"?`<div><button class="b d" data-a="del" data-id="${o.id}">${S.arm==="del"+o.id?"Bấm lần nữa để xóa":"Xóa hóa đơn"}</button></div>`:""}`:""}`;}
  return `<div class="row"><span class="ttl grow">${esc(o.seller?.name||o.type)}</span><span class="num"><b>${fmt(o.total)}</b> đ</span></div>${tabs}${body}`;}

/* ---------- Modal tải hóa đơn ---------- */
function renderModal(){const md=$("#modal");const open=S.modal||S.fedit||S.scanEdit;md.hidden=!open;if(!open)return;
  if(S.fedit){$("#modalBox").innerHTML=formEditor();return;}if(S.scanEdit){$("#modalBox").innerHTML=scanEditor();return;}
  const drafts=S.inv.filter(i=>i.status==="draft").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  const log=[...S.log].sort((a,b)=>(b.at||"").localeCompare(a.at||"")).slice(0,25);
  const rc={"Đã lưu":"ok","Trùng":"warn","Chứng từ khác":"neu","Không đọc":"warn","Lỗi":"bad"};
  $("#modalBox").innerHTML=`<div class="row"><span class="ttl grow" style="font-size:16px">📥 Tải hóa đơn</span><button class="b" data-a="closeUp">Đóng</button></div>
  <div class="panel"><div class="drop" id="drop" tabindex="0" role="button" aria-label="Chọn file hóa đơn"><b>Kéo thả hoặc bấm để chọn bộ chứng từ</b><br>PDF scan (ĐNC đã ký nếu có, hóa đơn, báo cáo dịch vụ / phiếu giao hàng, PO) hoặc ảnh chụp. Mỗi file là một hóa đơn. Chọn được nhiều file một lần.</div>
   <input type="file" id="file" accept="application/pdf,image/jpeg,image/png" multiple hidden>
   
   ${S.queue.map(q=>`<div class="row"><span class="pill ${rc[q.state]||"neu"}">${esc(q.state)}</span><span class="grow">${esc(q.name)}</span>${q.err?`<span class="k">${esc(q.err)}</span>`:""}${q.skipped?`<button class="b sm" data-a="dq" data-id="${q.id}">Bỏ</button>`:""}</div>`).join("")}</div>
  ${drafts.map(d=>{if(!S.edit.has(d.id))S.edit.set(d.id,clone(d));return draftCard(d.id);}).join("")}
  <div class="panel"><span class="ttl">Nhật ký tải lên</span>${log.length?`<div class="scroll"><table class="t"><thead><tr><th>Thời gian</th><th>File</th><th>Kết quả</th><th>Chi tiết</th></tr></thead><tbody>${log.map(l=>`<tr><td style="white-space:nowrap">${esc(dmy(l.at))} ${esc(String(l.at).slice(11,16))}</td><td>${esc(l.file)}</td><td><span class="pill ${rc[l.result]||"neu"}">${esc(l.result)}</span></td><td>${esc(l.msg)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="k">Chưa có lượt tải lên.</div>`}</div>`;}
function hmOptions(sel){return`<option value="">Chọn hạng mục…</option>`+KPROWS.filter(r=>r.stt.includes(".")).map(r=>`<option value="${esc(r.stt)}" ${r.stt===sel?"selected":""}>${esc(r.stt)} ${esc(r.name)}</option>`).join("");}

  const sum=d.items.reduce((s,x)=>s+num(x.amount),0);const vopts=S.byMst.get(d.seller.mst)||[];const icon={bad:"bad",warn:"warn",inf:"inf"};const pages=d.file?.pages||[];

  </div>
  <div class="scroll"><table class="t"><thead><tr><th>Dòng hàng / dịch vụ</th><th class="n">Trước thuế</th><th class="n">VAT %</th><th>Hạng mục kinh phí</th><th></th></tr></thead><tbody>
  ${d.items.map((it,k)=>`<tr><td><input data-e="items.${k}.desc" data-id="${id}" value="${esc(it.desc)}" style="width:100%"></td>
   <td class="n"><input data-e="items.${k}.amount" data-n="1" data-id="${id}" value="${fmt(it.amount)}" style="width:120px;text-align:right"></td>
   <td class="n"><input data-e="items.${k}.vatRate" data-n="1" data-id="${id}" value="${it.vatRate??""}" style="width:56px;text-align:right"></td>
   <td><select data-e="items.${k}.hm" data-id="${id}" style="max-width:260px">${hmOptions(it.hm)}</select></td><td>${d.items.length>1?`<button class="b sm" data-a="rmItem" data-id="${id}" data-k="${k}">✕</button>`:""}</td></tr>`).join("")}
  <tr><td colspan="5"><button class="b sm" data-a="addItem" data-id="${id}">+ Thêm dòng</button></td></tr>
  <tr class="tot"><td>Theo hóa đơn</td><td class="n"><input data-e="subtotal" data-n="1" data-id="${id}" value="${fmt(d.subtotal)}" style="width:120px;text-align:right"${bad("subtotal")}></td><td class="n" colspan="3">VAT <input data-e="vat" data-n="1" data-id="${id}" value="${fmt(d.vat)}" style="width:110px;text-align:right"> Tổng <input data-e="total" data-n="1" data-id="${id}" value="${fmt(d.total)}" style="width:120px;text-align:right"${bad("total")}></td></tr>
  <tr><td class="k">Cộng các dòng</td><td class="n k">${fmt(sum)}</td><td colspan="3"></td></tr></tbody></table></div>
  <div class="grid">
   <label class="chk"><input type="checkbox" data-e="noDnc" data-b="1" data-id="${id}" ${d.noDnc?"checked":""}> Không ra ĐNC (HO thanh toán theo hợp đồng)</label>
   ${d.noDnc?"":`<label class="f">Cách ghi trên ĐNC<select data-e="gopMode" data-id="${id}"><option value="" ${!d.gop?"selected":""}>Mỗi dòng hàng 1 dòng</option><option value="1" ${d.gop?"selected":""}>Gộp 1 dòng</option></select></label>

   <label class="f">Người thụ hưởng<select data-e="payeeKey" data-id="${id}"${bad("payee")}><option value="">Chọn…</option>${banks().map(b=>`<option value="${esc(b.key)}" ${b.key===d.payeeKey?"selected":""}>${esc(b.ten)} · ${esc(b.stk)}</option>`).join("")}</select></label>`}
  </div>
  <label class="f">Ghi chú thêm (in lên ĐNC dưới dòng cuối của hóa đơn)<textarea data-e="userNote" data-id="${id}" rows="2">${esc(d.userNote)}</textarea></label>
  <div class="checks">${cs.length?cs.map(c=>`<div><span class="pill ${icon[c.lv]}">${c.lv==="bad"?"Lỗi":c.lv==="warn"?"Cảnh báo":"Thông tin"}</span><span>${esc(c.t)}</span></div>`).join(""):`<div><span class="pill ok">Khớp</span><span>Số liệu khớp, MST có trong danh mục.</span></div>`}</div>

/* Vista Historical - Stock Variance Report parser */
const SVP=(()=>{
const num=s=>parseFloat(String(s).replace(/,/g,""));
const NUMRE=/^-?[\d,]+\.\d+$/;
function nm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
function parseLines(lines){
  let from="",to="",cat="",group="",loc="",items=[],pend=null,heads=[];const skip=/Historical - Stock Variance|Please take stock|Stocktake Group|^UOM|^Balance|^\(Net\)|visWStkVar|Vista Entertainment|Phan Huy|Phường|^Galaxy|Hồ Chí Minh|^Grand Total/;
  for(let raw of lines){const l=raw.replace(/\s+/g," ").trim();if(!l)continue;
    const m=l.match(/From:.*?(\d{2}\/\d{2}\/\d{4}).*Until:.*?(\d{2}\/\s?\d{2}\/\d{4})/);if(m){from=m[1];to=m[2].replace(/\s/g,"");continue;}
    if(skip.test(l))continue;
    if(/Total:/.test(l)){pend=null;heads=[];continue;}
    const t=l.split(" ");
    if(/^\d{1,6}$/.test(t[0])&&t.length>=14&&t.slice(-12).every(x=>NUMRE.test(x))){
      if(heads.length){if(heads.length>1){loc=heads[0];cat=heads[heads.length-1];}else cat=heads[0];heads=[];}
      const v=t.slice(-12).map(num);pend={code:t[0],uom:t.slice(1,t.length-12).join(" "),loc,cat,open:v[0],rec:v[1],tra:v[2],adj:v[3],waste:v[4],sales:v[5],usage:v[6],close:v[7],closeVal:v[8],varQty:v[9],cost:v[10],varCost:v[11],name:""};items.push(pend);continue;}
    if(t.every(x=>NUMRE.test(x))){pend=null;continue;} // subtotal
    if(pend){pend.name=(pend.name+" "+l).trim();continue;}
    heads.push(l);
  }
  /* gộp theo mã (cùng mã ở nhiều kho: Counter, Store Room...) */
  const by={},agg=[];items.forEach(it=>{let a=by[it.code];if(!a){a=by[it.code]={...it,locs:[]};agg.push(a);}else{["open","rec","tra","adj","waste","sales","usage","close","closeVal","varQty","varCost"].forEach(k=>a[k]=+(a[k]+it[k]).toFixed(4));}a.locs.push({loc:it.loc,close:it.close,waste:it.waste,varQty:it.varQty});});
  return {from,to,lines:items,items:agg};
}
function dmy(s){const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:"";}
async function fromPdf(buf){const pdf=await pdfjsLib.getDocument({data:buf}).promise;let lines=[];
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();const rows={};
    tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it);});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(" ")));}
  return parseLines(lines);}
/* ghép mặt hàng Vista với danh mục BM05: mã đã học -> tên trùng (bỏ dấu, bỏ khoảng trắng) -> tên bắt đầu giống nhau */
function mapTo(items,fbItems,codeMap){codeMap=codeMap||{};const key=s=>nm(s).replace(/ /g,"");const used=new Set(),res=new Map();
  items.forEach(it=>{const c=codeMap[it.code];if(c&&fbItems.some(f=>f[0]===c)){res.set(it.code,c);used.add(c);}});
  items.forEach(it=>{if(res.has(it.code))return;const k=key(it.name);const x=fbItems.find(f=>!used.has(f[0])&&key(f[1])===k);if(x){res.set(it.code,x[0]);used.add(x[0]);}});
  items.forEach(it=>{if(res.has(it.code))return;const k=key(it.name);if(k.length<6)return;const c=fbItems.filter(f=>{const n=key(f[1]);return !used.has(f[0])&&n.length>=6&&(n.startsWith(k)||k.startsWith(n));});if(c.length===1){res.set(it.code,c[0][0]);used.add(c[0][0]);}});
  return res;}
return {parseLines,fromPdf,mapTo,dmy,nm};})();

/* Đọc file Excel đã chuyển thành mảng 2 chiều (SheetJS sheet_to_json header:1, cellDates) */
const IMP=(()=>{
const nm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/\s+/g," ").trim();
const p2=n=>String(n).padStart(2,"0");
function dt(v){if(v==null||v==="")return"";if(v instanceof Date){const x=new Date(v.getTime()+12*3600e3);return x.toISOString().slice(0,10);}
  if(typeof v==="number"&&v>20000&&v<80000){const x=new Date(Date.UTC(1899,11,30)+v*864e5);return x.toISOString().slice(0,10);}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return`${m[3]}-${p2(m[2])}-${p2(m[1])}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:"";}
const nv=v=>{if(typeof v==="number")return v;const x=parseFloat(String(v??"").replace(/,/g,""));return isNaN(x)?0:x;};

  const C=cols(aoa[h],{ent:/^entity/,vno:/^vendor no/,vname:/^vendor name/,mst:/^ma so thue/,pre:/\(-\s*vat/,vat:/^vat/,tot:/\(\+\s*vat/,ref:/^reference/,desc:/^descriptions|^dien giai/,ifc:/^ifc/,st:/^trang thai/,gc:/^ghi chu/});
  let date="";for(let r=h-1;r>=0&&!date;r--)(aoa[r]||[]).forEach(c=>{if(!date&&c instanceof Date)date=dt(c);});
  const rows=[];for(let r=h+1;r<aoa.length;r++){const x=aoa[r]||[];if(tx(x[C.ent])!==entity)continue;
    rows.push({vendor:tx(x[C.vno]),vname:tx(x[C.vname]),mst:tx(x[C.mst]),pre:Math.round(nv(x[C.pre])),vat:Math.round(nv(x[C.vat])),ref:tx(x[C.ref]),desc:tx(x[C.desc]),ifc:tx(x[C.ifc]),ttct:tx(x[C.st]),gc:tx(x[C.gc])});}
  return{date,ym:date.slice(0,7),rows};}
/* Sổ quỹ (file Petty cash): mỗi sheet Tổng hợp Quỹ */
function cash(aoa){const h=aoa.findIndex(r=>r&&r.some(c=>/nguoi de nghi chi/.test(nm(c))));if(h<0)return null;
  const C=cols(aoa[h],{nguoi:/^nguoi de nghi/,dg:/^dien giai tren/,desc:/^dien giai thuc te/,date:/^ngay hoa don/,amt:/^so tien hoa don/,thu:/^thu/,ton:/^ton/,st:/^trang thai hoan/,nh:/^ngay hoan/,ttct:/^trang thai chung tu/,vno:/^vendor no/,vname:/^ten nha cung cap/,mst:/^ma so thue/,so:/^so hoa don/,ifc:/^ifc/});
  let tamUng=0;for(let r=h+1;r<=h+2;r++){const v=nv((aoa[r]||[])[C.ton]);if(v&&!tamUng)tamUng=v;}

    const done=/da hoan/.test(nm(x[C.st]));rows.push({nguoi:tx(x[C.nguoi]),dg:tx(x[C.dg]),desc:tx(x[C.desc]),date:d,amt:Math.round(a),st:done?"done":"pending",ngayHoan:done?dt(x[C.nh]):"",ttct:/^0$/.test(tx(x[C.ttct]))?"":tx(x[C.ttct]),vno:tx(x[C.vno]),vname:/dien tay/.test(nm(x[C.vname]))?"":tx(x[C.vname]),mst:tx(x[C.mst]),so:tx(x[C.so]),ifc:tx(x[C.ifc])});}
  return{tamUng,rows};}
/* Bảng tạm ứng quỹ các rạp: lấy dòng của rạp */
function tamUng(aoa,key){const h=aoa.findIndex(r=>r&&r.some(c=>/^ten rap/.test(nm(c))));if(h<0)return null;const ci=aoa[h].findIndex(c=>/^ten rap/.test(nm(c)));

function formChecks(f){const c=[],add=(lv,t)=>c.push({lv,t});const st=S.settings||{};

    else if(f.type==="quy_rap")add("inf",`Quỹ tạm ứng ${fmt(dm)} đ, tiền thực tế ${fmt(t)} đ → đã chi chưa hoàn ${fmt(dm-t)} đ (chưa có sổ quỹ tại ngày này để đối chiếu).`);
    else if(f.type!=="quy_fb"&&Math.abs(t-dm)>=1000)add("bad",`Tổng kiểm ${fmt(t)} đ lệch định mức ${fmt(dm)} đ: ${t>dm?"dư":"thiếu"} ${fmt(Math.abs(t-dm))} đ.`);else add("ok",`Khớp định mức ${fmt(dm)} đ.`);
    if(f.type==="float"&&f.h.note){const nums=(f.h.note.match(/\d{1,3}(?:\.\d{3})+/g)||[]).map(x=>+x.replace(/\./g,""));const s=nums.reduce((a,b)=>a+b,0);if(nums.length&&s!==t)add("warn",`Ghi chú két sắt + ngoài quầy = ${fmt(s)} đ, khác tổng kiểm ${fmt(t)} đ.`);}}

  if(f.type==="voucher")(f.rows||[]).forEach(r=>{const n=seriesCount(r.series);if(n==null)add("warn",`${r.loai}: không đọc được dải số series.`);else if(n!==+r.sl)add("bad",`${r.loai}: số lượng ghi ${fmt(r.sl)} nhưng dải series đếm được ${fmt(n)}. Kiểm tra lại.`);});
  if(f.type==="voucher"){const prev=S.forms.filter(x=>x.type==="voucher"&&x.date<f.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(prev)(f.rows||[]).forEach(r=>{const p=(prev.rows||[]).find(x=>x.loai===r.loai);if(p&&+p.sl!==+r.sl)add("inf",`${r.loai}: ${fmt(p.sl)} → ${fmt(r.sl)} (${+r.sl-+p.sl>0?"+":""}${fmt(+r.sl-+p.sl)}) so với lần kiểm ${fdate(prev.date)}.`);});}

function suggestTT(m){const lm=ymAdd(m,-1);const has=new Set(S.inv.filter(i=>i.status==="confirmed"&&i.ky===m).map(i=>i.seller.mst+"|"+i.cat));
  const rows=[];S.inv.filter(i=>i.status==="confirmed"&&i.ky===lm&&!has.has(i.seller.mst+"|"+i.cat)).forEach(i=>{const v=(S.byMst.get(i.seller.mst)||[])[0];
    rows.push({vendor:i.vendorNo||(v?v[0]:""),vname:i.seller.name,ifc:i.ifc||invIfc(i),mdesc:ifcName(i.ifc||invIfc(i)),pre:i.subtotal,vat:i.vat,ref:"Chưa có HĐ (ước tính)",desc:`${i.cat} T${m.slice(5)}.${m.slice(0,4)} (ước theo T${lm.slice(5)})`,pic:S.settings?.nguoiDeNghi||"",phone:""});});
  const prev=S.forms.filter(f=>f.type==="tich_truoc"&&f.month<m).sort((x,y)=>y.month.localeCompare(x.month))[0];
  if(prev){const bump=t=>String(t||"").replace(/T(\d{1,2})([.\/])(20\d\d)/g,(_,mm,sep,yy)=>{const n=ymAdd(`${yy}-${String(+mm).padStart(2,"0")}`,ymDiff(prev.month,m));return`T${n.slice(5)}${sep}${n.slice(0,4)}`;});
    prev.rows.filter(r=>/ước tính/i.test(r.ref)).forEach(r=>{if(rows.some(x=>x.vendor===r.vendor&&x.ifc===r.ifc&&x.pre===r.pre))return;rows.push(Object.assign({},r,{desc:bump(r.desc),ref:"Chưa có HĐ (ước tính)"}));});}

const r4=x=>+(+x).toFixed(4);
function fbFromSv(sc){const ky=sc.date;const prev=S.forms.filter(f=>f.type==="fb_dem"&&f.date<ky).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const f=blankForm("fb_dem");f.date=ky;f.month=ky.slice(0,7);f.src="Báo cáo Vista";f.h=Object.assign({},prev?.h||{},{svId:sc.id,ykien:""});
  const base=prev?prev.rows:FB_ITEMS.map(x=>({ma:x[0],ten:x[1],dvt:x[2]}));const items=sc.sv.items.filter(i=>i.cat!=="Vouchers");
  const map=SVP.mapTo(items,base.map(r=>[r.ma,r.ten,r.dvt]),(S.settings||{}).svMap);const byMa=new Map();items.forEach(i=>{const m=map.get(i.code);if(m&&!byMa.has(m))byMa.set(m,i);});
  const used=new Set();const V=i=>({code:i.code,close:r4(i.close),var:r4(i.varQty),waste:r4(i.waste)});const live=i=>Math.abs(i.close)>1e-6;
  f.rows=[];const gone=[];
  base.forEach(r=>{if(used.has(r.ma))return;const i=byMa.get(r.ma);if(!i){gone.push(r.ten);return;}used.add(r.ma);if(!live(i)){gone.push(r.ten);return;}
    f.rows.push({ma:r.ma,ten:r.ten,dvt:r.dvt,sl:r4(i.close),hh:"",gcl:"",hsd:r.hsd&&r.hsd>=ky?r.hsd:"",gc:r.gc||"",vcode:i.code,_v:V(i)});});

  f.h.gone=gone;

/* tìm hóa đơn trên app cho 1 dòng trích trước: cùng NCC, cùng kỳ; khớp theo hạng mục, số tiền cả HĐ, hoặc 1 dòng HĐ */
function ttInv(r,ym){const b=ttBrand(r.vname),c=ttCat(r.desc);const inv=S.inv.filter(i=>i.status==="confirmed"&&i.ky===ym&&ttBrand(i.seller?.name)===b);if(!inv.length)return null;
  const P=+r.pre||0,near=x=>Math.abs(x-P)<=1000;
  for(const i of inv){if(near(i.subtotal))return{i,amt:i.subtotal,how:"cả hóa đơn"};}

  let best=null;inv.forEach(i=>{const s=(i.items||[]).filter(x=>ttCat(x.desc||i.cat)===c).reduce((a,x)=>a+x.amount,0);if(s&&(!best||Math.abs(s-P)<Math.abs(best.amt-P)))best={i,amt:s,how:"các dòng "+c};});

const QUY={petty:"Quỹ rạp (petty cash)",fnb:"Quỹ F&B",float:"Float"};
const cashDoc=q=>S.cash.find(x=>x.id===q);
const cashRows=q=>(cashDoc(q)?.rows||[]).map((r,i)=>Object.assign({q,i},r));
const qDM=q=>+((S.settings?.quyDM||{})[q])||+(cashDoc(q)?.tamUng)||({petty:+(S.settings?.tamUngQuyRap)||20000000,fnb:15000000,float:60000000})[q];
const pendAt=(q,d)=>cashRows(q).filter(r=>r.date<=d&&(r.st==="pending"||(r.ngayHoan&&r.ngayHoan>d)));
const qOfForm=f=>f.type==="quy_rap"?"petty":f.type==="quy_fb"?"fnb":f.type==="float"?"float":null;
function cashRec(f){const q=qOfForm(f);if(!q)return null;const dm=qDM(q);const cnt=cashTotal(f);const doc=cashDoc(q);
  if(q==="float")return{q,dm,cnt,pend:[],ps:0,book:dm,diff:Math.abs(cnt-dm)<1000?0:cnt-dm,covered:true,why:[]};
  const all=cashRows(q);const first=all.reduce((a,r)=>!a||r.date<a?r.date:a,"");const covered=!!doc&&(!first||f.date>=first);
  const pend=covered?pendAt(q,f.date):[];const ps=pend.reduce((a,r)=>a+r.amt,0);const book=dm-ps,raw=cnt-book,diff=Math.abs(raw)<1000?0:raw;
  /* biến động giữa lần kiểm trước và lần này */
  const f0=S.forms.filter(x=>x.type===f.type&&x.date<f.date).sort((a,b)=>b.date.localeCompare(a.date))[0];let mv=null;
  if(f0){const ok=covered&&first&&f0.date>=first;const chi=all.filter(r=>r.date>f0.date&&r.date<=f.date),hoan=all.filter(r=>r.ngayHoan&&r.ngayHoan>f0.date&&r.ngayHoan<=f.date);
    const c0=cashTotal(f0),sc=chi.reduce((a,r)=>a+r.amt,0),sh=hoan.reduce((a,r)=>a+r.amt,0);const md=cnt-(c0-sc+sh);mv={f0,ok,c0,chi,hoan,sc,sh,exp:c0-sc+sh,diff:Math.abs(md)<1000?0:md};}
  return{q,dm,cnt,pend,ps,book,diff,raw,covered,first,mv,why:covered&&diff?cashWhy(all,f.date,diff):[]};}
/* tìm khoản giải thích được chênh lệch: 1 hoặc 2 khoản có tổng gần bằng số lệch (±1.000đ) */
function cashWhy(all,d,diff){const A=Math.abs(diff),near=x=>Math.abs(x-A)<=1000;const out=[];const L=r=>`${r.desc} ngày ${fdate(r.date)} (${fmt(r.amt)})`;
  const pend=all.filter(r=>r.date<=d&&(r.st==="pending"||(r.ngayHoan&&r.ngayHoan>d)));
  if(diff>0){pend.filter(r=>near(r.amt)).forEach(r=>out.push(`Gần bằng khoản ${L(r)}: sổ ghi đã chi nhưng tại lúc kiểm tiền có thể chưa chi ra, hoặc chi sau ngày kiểm mà ghi sổ lùi ngày.`));
    all.filter(r=>r.ngayHoan&&r.ngayHoan>d&&near(r.amt)).forEach(r=>out.push(`Gần bằng khoản hoàn ứng ${L(r)}, sổ ghi ngày hoàn ${fdate(r.ngayHoan)}: có thể tiền hoàn đã về trước ngày kiểm.`));
    if(!out.length)for(let i=0;i<pend.length;i++)for(let j=i+1;j<pend.length;j++)if(near(pend[i].amt+pend[j].amt))out.push(`Gần bằng tổng 2 khoản ${L(pend[i])} và ${L(pend[j])}.`);}
  else{all.filter(r=>r.date>d&&near(r.amt)).forEach(r=>out.push(`Gần bằng khoản ${L(r)} ghi sổ sau ngày kiểm: có thể đã chi trước khi kiểm nhưng ghi sổ trễ.`));
    all.filter(r=>r.ngayHoan&&r.ngayHoan<=d&&r.date<=d&&near(r.amt)).forEach(r=>out.push(`Gần bằng khoản ${L(r)} sổ ghi đã hoàn ngày ${fdate(r.ngayHoan)}: kiểm tra tiền hoàn đã thực nhận chưa.`));}
  if(!out.length)out.push(`Không có khoản chi/hoàn nào trên sổ khớp với số lệch ${fmt(A)}: cần đối chiếu lại phiếu chi và tiền mặt.`);return out;}

async function saveScans(files){const sc=S.scanEdit;if(!sc)return;

      const url=await storeFile(file,curYM()+"/scan");const id="s_"+uid();
      let linkLabel="";const L=sc.linkId;
      if(L&&L.startsWith("inv:")){const i=S.inv.find(x=>"inv:"+x.id===L);linkLabel=i?`HĐ ${i.number}`:"";}
      else if(L&&sc.mod==="dnc"){const d=S.dnc.find(x=>x.id===L);if(d){linkLabel=`ĐNC ${d.ifc}`;if(/ĐNC/.test(sc.type))await Store.put("dnc",d.id,Object.assign({},d,{status:"signed",signedPage:pages[0]||"",signedUrl:url,signedNote:"Bản scan ĐNC đã ký",signedAt:nowIso()}));}}
      else if(L){const f=S.forms.find(x=>x.id===L);if(f){linkLabel=FT[f.type].name;await Store.put("forms",f.id,Object.assign({},f,{status:"signed"}));}}
      await Store.put("scans",id,{mod:sc.mod,type:sc.type,date:sc.date,month:(sc.date||today()).slice(0,7),note:sc.note||"",linkId:L&&!L.startsWith("inv:")?L:"",invId:L&&L.startsWith("inv:")?L.slice(4):"",linkLabel,file:{name:file.name,url,pages},fileHash:hash,at:nowIso()});
      sc.msg=`Đã lưu ${file.name}${linkLabel?" và gắn với "+linkLabel:""}.`;}catch(e){sc.msg="Không lưu được: "+(e.message||e);sc.err=true;}renderModal();bind();}}

function exportKP(){if(!window.XLSX){toast("Không tải được thư viện Excel.","bad");return;}const y=$("#year").value;const rows=kpRows(y);if(!rows.length){toast("Năm "+y+" chưa có dữ liệu Kinh phí.","bad");return;}
  const E=XLSX.utils.encode_cell,ws={},R0=11;const k=KP[y]||{};const fm=k.fileMonths||0;const col=c=>XLSX.utils.encode_col(c);
  const put=(r,c,v,z)=>{const o=typeof v==="number"?{t:"n",v}:{t:"s",v:String(v)};if(z)o.z=z;ws[E({r,c})]=o;return o;};
  put(0,1,`KINH PHÍ RẠP ${(S.settings?.tenRap||"").toUpperCase()} NĂM ${y} – TRƯỚC VAT`);put(1,1,`T1–T${fm} lấy từ file ${k.src||""}; T${fm+1}–T12 cộng từ hóa đơn đã xác nhận trên app.`);

  put(R0-1,1,"STT");put(R0-1,2,"Hạng mục");for(let m=1;m<=12;m++)put(R0-1,7+m,"T"+m);put(R0-1,20,"Cả năm");
  const kids=r=>rows.filter(x=>x.stt.startsWith(r.stt+".")&&x.stt.split(".").length===r.stt.split(".").length+1);
  const val=(r,m)=>kpVal(y,m,r.stt).v;const memo=new Map();const tot=(r,m)=>{const key=r.stt+"|"+m;if(memo.has(key))return memo.get(key);const ks=kids(r);const v=ks.length?ks.reduce((a,x)=>a+tot(x,m),0):val(r,m);memo.set(key,v);return v;};
  const rowOf=new Map(rows.map((r,i)=>[r.stt,R0+i]));const cmt=t=>[{a:"Kinh phí",t,hidden:true}];
  rows.forEach((r,i)=>{const R=R0+i;put(R,1,r.stt);const nc=put(R,2,r.name);const inf=(k.info||{})[r.stt];if(inf)nc.c=cmt(inf);const ks=kids(r);
    for(let m=1;m<=12;m++){const v=tot(r,m);const o=put(R,7+m,Math.round(v),"#,##0");if(ks.length)o.f=ks.map(x=>col(7+m)+(rowOf.get(x.stt)+1)).join("+");
      const n=kpNote(y,m,r.stt);if(n)o.c=cmt(n);}

async function importKP(file){try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellComments:true});
    const sn=wb.SheetNames.find(n=>/detail/i.test(n))||wb.SheetNames[wb.SheetNames.length-1];const ws=wb.Sheets[sn];
    const y=(sn.match(/20\d\d/)||file.name.match(/20\d\d/)||[$("#year").value])[0];
    const rng=XLSX.utils.decode_range(ws["!ref"]);const rows=[],notes={},info={};const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
    for(let r=11;r<=rng.e.r;r++){const stt=cell(r,1)?.v,name=cell(r,2)?.v;if(stt==null||String(stt).trim()==="")continue;const s=String(stt).trim();
      const m=[];for(let c=8;c<=19;c++){const v=cell(r,c);m.push(v&&typeof v.v==="number"?Math.round(v.v):0);const cm=v?.c;if(cm&&cm.length){(notes[s]=notes[s]||{})[String(c-7)]=cm.map(x=>String(x.t||"").replace(/^[^\n:]{1,40}:\n/,"")).join("\n").trim();}}
      const ci=cell(r,2)?.c;if(ci&&ci.length)info[s]=ci.map(x=>String(x.t||"").replace(/^[^\n:]{1,40}:\n/,"")).join("\n").trim();
      rows.push({stt:s,name:String(name||"").replace(/\s+/g," ").trim(),m});}
    if(!rows.length)throw new Error("Không tìm thấy bảng hạng mục trong sheet "+sn);

    await Store.put("kp",y,{rows,fileMonths:fm,src:file.name,notes,info,uploadedAt:nowIso()});_mcache.clear();
    toast(`Đã cập nhật Kinh phí ${y} từ ${file.name}: ${rows.length} hạng mục, số liệu T1–T${fm}, ${nNote} ghi chú ẩn đã mở.`);setupPeriod();render();}
  catch(e){toast("Không đọc được file Kinh phí: "+(e.message||e),"bad");}}

  const kf=$("#kpFile");if(kf)kf.onchange=()=>{if(kf.files[0])importKP(kf.files[0]);kf.value="";};
}
document.addEventListener("change",e=>{const pe=e.target.closest("[data-pe]");if(pe&&S.planEdit){const k=pe.dataset.pe.split(".");if(k.length===1)S.planEdit[k[0]]=pe.value;else{S.planEdit[k[0]]=Object.assign({},S.planEdit[k[0]]);S.planEdit[k[0]][k[1]]=pe.type==="checkbox"?(pe.checked?1:0):pe.value;}return;}
  const ff=e.target.closest("[data-f]");if(ff&&S.fedit){let v=ff.value;if(ff.dataset.n)v=v===""?"":num(v);setPath(S.fedit,ff.dataset.f,v);
    if(S.fedit.type==="fb_dc"&&/rows\.\d+\.ma$/.test(ff.dataset.f)){const i=+ff.dataset.f.split(".")[1];const it=FB_ITEMS.find(x=>x[0]===v);if(it){S.fedit.rows[i].ten=it[1];S.fedit.rows[i].dvt=it[2];}}
    if(S.fedit.type==="tich_truoc"&&/rows\.\d+\.vendor$/.test(ff.dataset.f)){const i=+ff.dataset.f.split(".")[1];const vv=S.byNo.get(String(v).trim());if(vv)S.fedit.rows[i].vname=vv[1];}
    const md=$("#modal"),y=md.scrollTop;renderModal();bind();md.scrollTop=y;return;}
  const ss=e.target.closest("[data-s]");if(ss&&S.scanEdit){S.scanEdit[ss.dataset.s]=ss.value;return;}
  const el=e.target.closest("[data-e]");if(!el)return;const d=S.edit.get(el.dataset.id);if(!d)return;const k=el.dataset.e;
  let v=el.dataset.b?el.checked:el.value;if(el.dataset.n)v=k.endsWith("vatRate")?(String(v).trim()===""?null:num(v)):Math.round(num(v));if(k==="seller.mst")v=mstN(v);
  if(k==="gopMode"){if(v){const t=tpls()[d.seller.mst];d.gop=t?.gop?.[d.cat]||d.cat;}else d.gop=null;}else setPath(d,k,v);
  if(k==="date"){d.month=ymOf(v);if(!d.ky)d.ky=ymOf(v);}
  if(k==="seller.mst"){const o=S.byMst.get(v)||[];d.vendorNo=o[0]?o[0][0]:"";d.seller.name=o[0]?o[0][1]:d.seller.name;const bk=banks().find(b=>b.mst&&mstN(b.mst)===v);if(bk)d.payeeKey=bk.key;}
  const md=$("#modal"),y=md.scrollTop;renderModal();bind();md.scrollTop=y;});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="sub"){S.sub=b.dataset.k;render();}
  else if(a==="msub"){if(b.dataset.m==="dnc")S.sub=b.dataset.k;else S.msub[b.dataset.m]=b.dataset.k;S.arcPage=0;render();}
  else if(a==="newForm"){S.fedit=blankForm(b.dataset.k);render();}
  else if(a==="kkNew"){const f=blankForm(b.dataset.k);f.date=b.dataset.d;f.month=f.date.slice(0,7);if(f.type==="voucher")f.h.tonden=f.date;S.fedit=f;render();}
  else if(a==="kkSv"){e.preventDefault();const sc=S.scans.find(x=>x.id===id);if(!sc)return;if(b.dataset.k==="fb_dc"){const f=blankForm("fb_dc");f.date=sc.date;f.month=sc.date.slice(0,7);S.fedit=dcFromSv(f,sc);}else S.fedit=fbFromSv(sc);render();}
  else if(a==="kkView"){e.preventDefault();const f=S.forms.find(x=>x.id===id);if(!f)return;setYM(f.month);S.msub.kk="list";S.selForm=id;render();window.scrollTo(0,0);}
  else if(a==="kkMon"){$("#mon").value=b.dataset.k;render();}
  else if(a==="svUp"){$("#svFile").click();}
  else if(a==="dcSv"){const sc=S.scans.find(x=>x.id===b.dataset.k);if(sc){dcFromSv(S.fedit,sc);renderModal();bind();}}
  else if(a==="planEdit"){S.planEdit=kkPlan();render();}
  else if(a==="planCancel"){S.planEdit=null;render();}
  else if(a==="planSave"){const st=clone(S.settings||{});st.kkPlan=S.planEdit;await Store.setSettings(st);await Store.addHist({at:nowIso(),summary:"Sửa kế hoạch kiểm kê định kỳ"});S.planEdit=null;toast("Đã lưu kế hoạch kiểm kê.");render();}
  else if(a==="ttImp"){$("#ttFile").click();}
  else if(a==="ttGo"){$("#mon").value=b.dataset.k;S.msub.tt="month";render();}
  else if(a==="cashImp"){$("#cashFile").click();}
  else if(a==="dmImp"){$("#dmFile").click();}
  else if(a==="printScan"){printScan(S.scans.find(x=>x.id===id));}
  else if(a==="printArc"){printScan({file:{pages:S._arcPages||[]}});}
  else if(a==="ttNotes"){S.ttNotes=!S.ttNotes;render();}
  else if(a==="pdfScan"){exportPdf(S.scans.find(x=>x.id===id)?.file);}
  else if(a==="pdfArc"){exportPdf(S._arcFile);}
  else if(a==="kpExport"){exportKP();}
  else if(a==="seedLoad"){b.disabled=true;await seedLoad();}
  else if(a==="kpNotes"){S.showNotes=!S.showNotes;render();}
  else if(a==="selForm"){S.selForm=id;render();}
  else if(a==="editForm"){S.fedit=clone(S.forms.find(x=>x.id===id));render();}
  else if(a==="copyForm"){const o=S.forms.find(x=>x.id===id);const f=clone(o);f.id="f_"+uid();f.status="draft";f.src="Lập trên app";f.date=today();f.month=curYM();if(f.type==="dong_phuc")f.rows.forEach(r=>{r.xnt=r.tt;r.tt="";r.gt="";});if(f.type==="fb_dem")f.rows.forEach(r=>{r.sl="";r.hh="";r.gcl="";r.gc="";});if(["quy_rap","quy_fb","float","du_thieu"].includes(f.type)){f.rows.forEach(r=>{r.sl=0;r.gc="";});f.h.note="";}if(f.type==="fb_dc")f.rows=[];if(f.type==="tich_truoc"){f.rows=suggestTT(curYM());f.h.duAn=`Chi phí Tháng ${curYM().slice(5)}/${curYM().slice(0,4)}`;}S.fedit=f;render();}
  else if(a==="closeForm"){S.fedit=null;render();}
  else if(a==="saveForm"){await saveForm();}
  else if(a==="delForm"){if(S.arm==="delf"){S.arm=null;await Store.del("forms",S.fedit.id);S.fedit=null;toast("Đã xóa biên bản.");}else{S.arm="delf";renderModal();bind();}}
  else if(a==="addRow"){const f=S.fedit;f.rows.push(f.type==="fb_dc"?{ma:"",ten:"",dvt:"",loai:"Giảm",sl:"",ngay:f.date,lydo:""}:{});renderModal();bind();}
  else if(a==="rmRow"){S.fedit.rows.splice(+b.dataset.k,1);renderModal();bind();}
  else if(a==="ttSuggest"){S.fedit.rows=suggestTT(S.fedit.month||curYM());renderModal();bind();}
  else if(a==="printForm"){const f=S.forms.find(x=>x.id===id);$("#printArea").innerHTML=formHtml(f)+cashAttach(f,true);if(DEMO){toast("Bản xem trước trong Claude không mở được hộp thoại in. Trên Vercel nút này mở hộp thoại in / lưu PDF.","inf");}else{window.print();if(f.status==="draft")await Store.put("forms",f.id,Object.assign({},f,{status:"printed"}));}}
  else if(a==="xlsTT"){xlsTT(S.forms.find(x=>x.id===id));}
  else if(a==="openScan"){S.scanEdit={mod:b.dataset.k,type:SCAN_TYPES[b.dataset.k][0],date:today(),linkId:"",note:""};render();}
  else if(a==="closeScan"){S.scanEdit=null;render();}
  else if(a==="selScan"){S.selScan=id;S.arcPage=0;render();}
  else if(a==="kpImport"){$("#kpFile").click();}
  else if(a==="openUp"){S.modal=true;render();}
  else if(a==="closeUp"){S.modal=false;render();}
  else if(a==="ok"){b.disabled=true;await confirmDraft(id);}
  else if(a==="del"){if(S.arm==="del"+id){S.arm=null;await removeInv(id);}else{S.arm="del"+id;render();setTimeout(()=>{if(S.arm==="del"+id){S.arm=null;render();}},4000);}}
  else if(a==="addItem"){S.edit.get(id).items.push({desc:"",amount:0,vatRate:null,hm:""});renderModal();bind();}
  else if(a==="rmItem"){S.edit.get(id).items.splice(+b.dataset.k,1);renderModal();bind();}
  else if(a==="dq"){S.queue=S.queue.filter(q=>q.id!==id);render();}
  else if(a==="sel"){S.selDnc=id;S.showRender=null;render();}
  else if(a==="toggleRender"){S.showRender=S.showRender===id?null:id;render();}
  else if(a==="print")printDncs([S.dnc.find(x=>x.id===id)]);
  else if(a==="printall"){const m=curYM();printDncs(S.dnc.filter(x=>x.month===m&&x.status==="open"));}
  else if(a==="signUp"){const sf=$("#signFile");sf.dataset.id=id;sf.click();}
  else if(a==="bsel"){S.budgetSel=S.budgetSel===b.dataset.k?null:b.dataset.k;render();}
  else if(a==="arcSel"){S.selArc=id;S.arcPage=0;S.arcView="pages";render();}
  else if(a==="arcPage"){S.arcPage=+b.dataset.k;render();}
  else if(a==="arcView"){S.arcView=b.dataset.k;render();}
  else if(a==="goArc"){const i=S.inv.find(x=>x.id===id);if(!i)return;setYM(i.month);S.tab="dnc";S.sub="archive";S.selArc=id;S.arcPage=0;S.arcView="pages";syncTabs();render();window.scrollTo(0,0);}
  else if(a==="goDnc"){const d=S.dnc.find(x=>x.id===id);if(!d)return;setYM(d.month);S.sub="list";S.selDnc=id;render();window.scrollTo(0,0);}
  else if(a==="tplDnc"){const st=clone(S.settings);const t=st.templates[b.dataset.k];t.noDnc=!t.noDnc;await Store.setSettings(st);await Store.addHist({at:nowIso(),summary:`Mẫu ${t.name}: ${t.noDnc?"không ra ĐNC":"có ra ĐNC"}`});}
  else if(a==="tplDel"){const k=b.dataset.k;if(S.arm==="tpl"+k){S.arm=null;const st=clone(S.settings);const n=st.templates[k]?.name;delete st.templates[k];await Store.setSettings(st);await Store.addHist({at:nowIso(),summary:`Xóa mẫu NCC ${n}`});}else{S.arm="tpl"+k;render();}}
  else if(a==="tpl")exportTpl();
  else if(a==="imp")$("#tplf").click();
  else if(a==="impok")applyTpl();
  else if(a==="impno"){S.pendingImport=null;render();}
});
function setYM(ym){if(!ym)return;$("#year").value=ym.slice(0,4);fillMonths(false);$("#mon").value=String(+ym.slice(5));}
function syncTabs(){document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===S.tab?"true":"false"));}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"){S.modal=false;S.fedit=null;S.scanEdit=null;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.modal||S.fedit||S.scanEdit)){S.modal=false;S.fedit=null;S.scanEdit=null;render();}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("ditem")){e.preventDefault();e.target.click();}});

let saved=null;try{saved=sessionStorage.getItem("ctr-session")}catch(e){}
const acc=(CFG.accounts||[]).find(a=>a.rap===saved);if(acc)enter(acc);else showLogin();
})();
</script>
